<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Access and filter official company job sites.">
    <title>Official Company Job Sites</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Official Company Job Sites</h1>
    </header>

    <main>
        <!-- Clear usage instructions -->
        <section class="instructions-card" aria-labelledby="instructions-heading">
            <h2 id="instructions-heading">How to Use This Site</h2>
            <p>Use the filter buttons below to switch between our <strong>Retail</strong> and <strong>Warehouse</strong>
                job categories. Click on any job site link to open it in a new tab.</p>
        </section>

        <!-- Filter Buttons -->
        <section aria-labelledby="filter-heading" class="filters">
            <h2 id="filter-heading" class="sr-only">Filter Links</h2>
            <button class="filter-btn active" data-filter="all" aria-pressed="true">All Links</button>
            <button class="filter-btn" data-filter="retail" aria-pressed="false">Retail</button>
            <button class="filter-btn" data-filter="warehouse" aria-pressed="false">Warehouse</button>
        </section>

        <!-- Dynamic List Container -->
        <section aria-labelledby="links-heading">
            <h2 id="links-heading" class="sr-only">Available Job Sites</h2>
            <ul id="link-list" class="link-list" aria-live="polite">
                <li class="loading">Loading links...</li>
            </ul>
        </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
